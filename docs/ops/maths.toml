[ER]
prototype = "ER f l i"
short = "Euclidean rhythm, `f` is fill (`1-32`), `l` is length (`1-32`) and `i` is step (any value), returns `0` or `1`"
description="""
Euclidean rhythm helper, as described by Godfried Toussaint in his 2005 paper ["The Euclidean Algorithm Generates Traditional Musical Rhythms"][euclidean_rhythm_paper][^euclidean_rhythm_citation]. From the abstract:

 - `f` is fill (`1-32`) and should be less then or equal to length
 - `l` is length (`1-32`)
 - `i` is the step index, and will work with negative as well as positive numbers

If you wish to add rotation as well, use the following form:

```
ER f l SUB i r
```

where `r` is the number of step of _forward_ rotation you want.

For more info, see the post on [samdoshi.com][samdoshi_com_euclidean]

[samdoshi_com_euclidean]: http://samdoshi.com/post/2016/03/teletype-euclidean/
[euclidean_rhythm_paper]: http://cgm.cs.mcgill.ca/~godfried/publications/banff.pdf
[^euclidean_rhythm_citation]: Toussaint, G. T. (2005, July). The Euclidean algorithm generates traditional musical rhythms. _In Proceedings of BRIDGES: Mathematical Connections in Art, Music and Science_ (pp. 47-56).
"""

[NR]
prototype = "NR p m f s"
short = "Numeric Repeater, `p` is prime pattern (`0-31`), `m` is & mask (`0-3`), `f` is variation factor (`0-16`) and `s` is step (`0-15`), returns `0` or `1`"
description = """
Numeric Repeater is similar to ER, except it generates patterns using the binary arithmetic process found in ["Noise Engineering's Numeric Repetitor"][numeric_repetitor]. From the description:

Numeric Repetitor is a rhythmic gate generator based on binary arithmetic. A core pattern forms the basis and variation is achieved by treating this pattern as a binary number and multiplying it by another. NR contains 32 prime rhythms derived by examining all possible rhythms and weeding out bad ones via heuristic.

All parameters wrap around their specified ranges automatically and support negative indexing.

Masks
 - `0` is no mask
 - `1` is `0x0F0F`
 - `2` is `0xF003`
 - `3` is `0x1F0`

For further detail ["see the manual"][nr_manual].

[numeric_repetitor]: https://www.noiseengineering.us/shop/numeric-repetitor
[nr_manual]: https://static1.squarespace.com/static/58c709192e69cf2422026fa6/t/5e6041ad4cbc0979d6d793f2/1583366574430/NR_manual.pdf
"""

["DR.T"]
prototype = "DR.T b p q l s"
short = "Tresillo helper, `b` is the drum bank (`0-4`), `p` is first pattern (0-215), `q` is the second pattern (0-215), `l` is length (`1-64`), and step is the step number (0-length-1), returns `0` or `1`"
description = """
The Tresillo helper uses the preset drum patterns described in the drum pattern help function in a 3, 3, 2 rythmic formation. In the tresillo, pattern 1 will be repeated twice for a number of steps determined by the overall length of the pattern. A pattern of length 8 will play the first three steps of your selected pattern 1 twice, and 
the first two steps of pattern 2 once. A pattern length of 16 will play the first six steps of selected pattern 1 twice, and the first four steps of pattern 2 once. And so on. The max length is 64. Length will be rounded down to the nearest multiple of 8. The step number wraps at the given length.
"""

["DR.P"]
prototype = "DR.P b p s"
short = "Drum pattern helper, `b` is the drum bank (`0-4`), `p` is the pattern (0-215) and step is the step number (0-15), returns `0` or `1`"
description = """
The drum helper uses preset drum patterns to give 16-step gate patterns. Gates wrap after step 16. Bank 0 is a set of pseudo random gates increasing in density at higher numbered patterns, where pattern 0 is empty,
and pattern 215 is 1s. Bank 1 is bass drum patterns. Bank 2 is snare drum patterns. Bank 3 is closed hi-hats. Bank 4 is open hi-hits and in some cases cymbals. Bank 1-4 patterns are related to each other (bank 1 pattern 1's bass drum pattern fits bank 2 pattern 1's snare drum pattern). 
The patterns are from [Paul Wenzel's "Pocket Operations" book](https://shittyrecording.studio/).
"""

["DR.V"]
prototype = "DR.V p s"
short = "Velocity helper. `p` is the pattern (0-19). `s` is the step number (0-15)"
description = """
The velocity helper gives velocity values (0-16383) at each step. The values are intended to be used for drum hit velocities. There are 16 steps, which wrap around. Divide by 129 to convert to midi cc values.
"""

[CA]
prototype = "CA rule"
short = "Cellular-automaton rhythm. Advances one generation using Wolfram `rule` (`0-255`) and returns the centre cell (`0` or `1`)"
description = """
`CA` is a rhythm generator based on an elementary (Wolfram 1D) cellular automaton: a single `rule` number (`0-255`) is the whole character of the rhythm. A row of 32 cells lives in memory; each time you call `CA` it computes the next generation — every cell's new value is decided by itself plus its two (wrap-around) neighbours, looked up in the 8 bits of `rule` — and returns the centre cell as a `0`/`1` gate. Drop it into a metro:

```
M: IF CA 90: TR.P 1
```

Different rules give wildly different but structured behaviour — Rule 90 draws fractal (Sierpinski) patterns, Rule 30 is chaotic, Rule 110 is famously complex and never settles into an obvious loop. With 32 cyclic cells the period is effectively non-repeating for musical purposes.

`rule` is masked to its low 8 bits, so out-of-range or modulated values wrap into `0-255` rather than erroring.

The automaton is one global instance (like `DRUNK`). If the row ever dies to all-zero (permanent silence), a single centre cell is automatically replanted so a metro-driven `CA` never gets stuck silent (a fully saturated all-ones row, by contrast, is a valid dense state and is left alone). Use `CA.SEED` to (re)seed it, and `CA.X` to read other cells of the same generation as correlated rhythm voices. The row is runtime state and is not saved with the scene; it resets to a single centre cell on `INIT`.
"""

["CA.X"]
prototype = "CA.X off"
short = "Reads the cellular-automaton cell at `off` cells from the centre (wraps mod 32) without advancing, returns `0` or `1`"
description = """
`CA.X` reads a cell of the **current** `CA` row without advancing the automaton, so one automaton can drive several *correlated* rhythm voices from the same generation. `off` is an offset from the centre cell (`CA.X 0` is the same cell `CA` returns) and wraps mod 32, so negative and large offsets are fine.

```
M: IF CA 90: TR.P 1      # main gate (advances the automaton)
   IF CA.X 6: TR.P 2     # correlated voice, same generation
   IF CA.X -6: TR.P 3
```
"""

["CA.SEED"]
prototype = "CA.SEED v"
short = "Seeds the cellular-automaton row from `v`. `v = 0` plants a single centre cell; otherwise `v`'s 16 bits are written centred in the row"
description = """
`CA.SEED` (re)seeds the `CA` row. `CA.SEED 0` plants the canonical single centre cell (guaranteed alive). A non-zero `v` writes its 16 bits centred in the 32-cell row, giving a deterministic custom starting pattern. Combine with `RND`/`RRAND` for a random seed, e.g. `CA.SEED RND 32767`. Reseeding makes a run reproducible from a known starting point.
"""

[POLY]
prototype = "POLY a b f s"
short = "Interference rhythm: OR of two Euclidean voices of length `a` and `b`, each with fill `f`, at step `s`. Returns `0` or `1`"
description = """
`POLY` is an interference (phasing) rhythm. It runs two Euclidean voices of *different* periods -- length `a` with `f` hits, and length `b` with `f` hits -- and returns their combination at step `s`. Because the two periods differ, the voices drift in and out of phase on their own, so the composite rhythm evolves continuously with no modulation. It is a pure function of `s` (like `ER`), so it is resettable and you can run many independent instances.

 - `a`, `b` are the two voice lengths (`1-32`)
 - `f` is the number of hits per voice (the density knob); `f = 1` gives sparse single pulses
 - `s` is the step (e.g. a counter advanced by your metro)

`POLY` returns the **OR** of the two voices -- spaced onsets that phase against each other. The companions `POLY.X` (XOR) and `POLY.A` (AND) read the same relationship differently; patch all three to drive correlated voices that breathe together.

Both voices place an onset on step 0, so they coincide there and then drift apart; the coincidence recurs every `LCM(a, b)` steps. To rotate the whole pattern, shift the step (`POLY a b f SUB s r`). Out-of-range arguments clamp to a musical result (a large `f` means dense, not silent).

Each voice is exactly `euclidean(f, len, s)`, so for in-range arguments `POLY a b f s` is equivalent to `| ER f a s ER f b s`. (They diverge only out of range, where `POLY` clamps to a dense result and bare `ER` returns silence.)
"""

["POLY.X"]
prototype = "POLY.X a b f s"
short = "As `POLY`, but XOR of the two Euclidean voices: fires when exactly one voice hits, dropping out when they coincide. Returns `0` or `1`"
description = """
`POLY.X` is the XOR of the two Euclidean voices used by `POLY` (same `a b f s` arguments). It fires when *exactly one* voice hits and is silent whenever both coincide -- so it is the drifting pair with the alignment removed, including the onset on step 0. Useful when you want the phasing motion without the periodic "both" hit.
"""

["POLY.A"]
prototype = "POLY.A a b f s"
short = "As `POLY`, but AND of the two Euclidean voices: fires only when both coincide (every LCM(a,b) steps). Returns `0` or `1`"
description = """
`POLY.A` is the AND of the two Euclidean voices used by `POLY` (same `a b f s` arguments). It fires only when *both* voices hit the same step -- giving sparse accents that mark the moments of alignment. Good as a rare downbeat layer beneath `POLY` / `POLY.X`. With `f = 1` (single pulses) this happens exactly every `LCM(a, b)` steps; with a higher fill the two patterns can also coincide on other aligned steps.
"""

[ERD]
prototype = "ERD f l b s"
short = "Breathing Euclidean: a Euclidean rhythm of length `l` whose fill swells `1 -> f -> 1` (triangle) over a breath of `b` steps, read at step `s`. Returns `0` or `1`"
description = """
`ERD` is a Euclidean rhythm with a *breathing* density: the fill ramps smoothly up from 1 to `f` and back down over `b` steps, so the rhythm thickens and thins on its own -- the slow build-and-release at the heart of ambient. It is a pure function of `s` (like `ER`), so it is resettable and supports many independent instances.

 - `f` is the peak fill (density at the top of the swell)
 - `l` is the Euclidean length (`1-32`)
 - `b` is the breath period in steps (one full swell up and back); `b < 2` disables breathing, giving a plain `ER f l s`
 - `s` is the step

At `s = 0` the fill is 1 and swells to `f` at the midpoint of each breath. Keep `f` well below `l` for sparse, airy results. Out-of-range arguments clamp to a musical result rather than falling silent. See `ERD.W` for a randomly-wandering density instead of a smooth swell.
"""

["ERD.W"]
prototype = "ERD.W f l h s"
short = "Wandering Euclidean: like `ERD`, but the fill jumps to a new random level in `1..f` every `h` steps and holds. Returns `0` or `1`"
description = """
`ERD.W` is a Euclidean rhythm whose fill **wanders**: every `h` steps it jumps to a new pseudo-random density in `1..f` and holds it until the next jump (sample-and-hold). This gives an organic, never-quite-repeating drift rather than the smooth swell of `ERD`. It is deterministic (the random level is derived from the step), so it is pure and resettable.

 - `f` is the maximum fill, `l` the Euclidean length (`1-32`)
 - `h` is the hold length in steps between density changes (`h < 1` is treated as 1)
 - `s` is the step

Out-of-range arguments clamp to a musical result. Use `ERD` for a predictable swell instead.
"""

[BB]
prototype = "BB seed s"
short = "Bytebeat rhythm: `seed` selects a bitwise formula; returns a spaced trigger on the rising edge of the formula at step `s`. Returns `0` or `1`"
description = """
`BB` turns a "bytebeat" (a tiny bitwise formula of time) into a rhythm. `seed` picks one of several built-in formulas, each with its own character and density, giving lots of structured-but-quirky variety from a single number. The output is the **rising edge** of the formula, so triggers are always spaced -- there are never two hits on consecutive steps. It is a pure function of `s`, so it is resettable.

 - `seed` selects the formula (wraps, so any integer is valid)
 - `s` is the step

Densities vary by seed from very sparse to busy. `BB` is a pure trigger source -- combine it with the other rhythm ops to layer textures.
"""

