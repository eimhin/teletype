short = "advance the working pattern one tick and return the value at the new index"
description = """Advance the working pattern's playhead by one tick, honouring the cell durations (`P.D`), playback mode (`P.MODE`), direction (`P.DIR`) and stride (`P.STRIDE`), then return the value at the resulting index. The playhead only moves to a new cell once the current cell's duration has elapsed; until then `P.STEP` returns the same value (dwelling)."""

