["P.A"]
prototype = "P.A x y n"
short = "non-destructive accumulator: return active pattern[`x`] + per-cell offset, then advance the offset by `y`; if `n` > 0 the offset resets every `n`-th call"
description = """
Returns `P x` plus a per-cell accumulator offset, then advances that offset by
`y`. The pattern value itself is never modified.

Pass `n` = 0 to disable the auto-reset counter; otherwise the offset (and the
per-cell trigger counter) snap back to 0 every `n`-th call.

Use `P.A.W` to bound the offset to a range (Oxi/Metropolix-style wrap).

State is per-cell and per-pattern (8 patterns × 64 cells), held in RAM only —
not persisted to flash. Use `ACC.CLR` to zero all accumulators (typically from
the init script).
"""

["PN.A"]
prototype = "PN.A x y z n"
short = "as `P.A`, but on pattern `x` at index `y` with step `z` and reset count `n`"

["P.A.W"]
prototype = "P.A.W x y a b n"
short = "as `P.A`, but the per-cell offset wraps in `a`..`b` (inclusive on `a`, exclusive on `b+1` — modular). `n` reset count is last to keep `a`/`b` in the same positions as `P.+W`."

["PN.A.W"]
prototype = "PN.A.W x y z a b n"
short = "as `P.A.W`, but on pattern `x`"

["ACC.CLR"]
prototype = "ACC.CLR"
short = "zero all accumulator offsets and counters across every pattern; intended for the init script"

["P.MAP"]
prototype = "P.MAP: ..."
short = "apply the 'function' to each value in the active pattern, `I` takes each pattern value"
description = """
Replace each cell in the active pattern (between the START and END of the pattern) by assigning
the variable I to the current value of the cell, evaluating the command after the mod, and
assigning that pattern cell with the result. The 'map' higher-order function from functional
programming, with the command giving the function of `I` to map over the pattern.

For example:

```
P.MAP: * 2 I  => double each cell in the active pattern
```
"""

["PN.MAP"]
prototype = "PN.MAP x: ..."
short = "apply the 'function' to each value in pattern `x`, `I` takes each pattern value"

["P.MOTIF"]
prototype = "P.MOTIF length variation transposition"
short = "fill the working pattern with a generated diatonic motif and variations"
description = """Generate a short melodic motif and write it, repeated with variations, across the working pattern's `START..END` window. Output values are diatonic scale degrees (`1-7` = one octave), intended to be quantised downstream with `N.S` or `QT.S`.

`length` is the motif length in cells, clamped to `2-4`. `variation` (wrapped to `0-7`) selects the transformation applied to each statement after the first:

- `0` EXACT — repeat unchanged
- `1` INVERT — mirror intervals
- `2` RETROGRADE — reverse
- `3` ALTERNATE — alternate prime and inverted
- `4` ORNAMENT — nudge one random note
- `5` COMPRESS — halve intervals
- `6` EXPAND — double intervals
- `7` ROTATE — rotate the motif

`transposition` is a signed scale-degree shift added per successive statement. The motif is drawn from the pattern random generator (see `P.SEED`), so the same seed reproduces the same motif. Does not return a value."""

["PN.MOTIF"]
prototype = "PN.MOTIF x length variation transposition"
short = "fill pattern `x` with a generated diatonic motif and variations"
description = "As `P.MOTIF`, but operates on pattern `x` rather than the working pattern."

["P.CP"]
prototype = "P.CP rule offset"
short = "return a diatonic counterpoint degree against the value at the current index"
description = """Read a counterpoint voice against the working pattern's value at the current index (`P.I`), using the whole `START..END` window for melodic context. Input and output are diatonic scale degrees, to pair with `P.MOTIF` and `N.S` / `QT.S`. Stateless: does not advance the playhead or modify the pattern.

`rule` (wrapped to `0-7`) selects the counterpoint style:

- `0` BALANCED
- `1` CONTRARY — move opposite to the melody
- `2` PARALLEL — favour 3rds and 6ths above
- `3` BASS — stay below, prefer 5ths and octaves
- `4` MIRROR — invert around an axis
- `5` OBLIQUE — pull toward the tonic octave
- `6` CANON — echo an earlier point in the window
- `7` FOLLOW — move in the same direction as the melody

`offset` is a signed scale-degree shift added to the result."""

["PN.CP"]
prototype = "PN.CP x rule offset"
short = "return a diatonic counterpoint degree against the current value of pattern `x`"
description = "As `P.CP`, but reads pattern `x` rather than the working pattern."

["P.FUGUE"]
prototype = "P.FUGUE voice division transpose mode phase clock"
short = "read the working pattern as a fugal voice; return one scale degree for the given clock"
description = """Read the working pattern's `START..END` window as a fugal subject and return one diatonic scale degree determined purely by `clock` (the caller supplies and increments it, usually `T`). Stateless with respect to the pattern: never writes the pattern or advances `P.I`. Multiple calls with different args produce a multi-voice fugal texture.

- `division` — ticks per note; negative reverses direction. `0` returns `0`.
- `transpose` — signed scale-degree offset added to the result.
- `mode` — subject transformation (out of range coerces to PRIME): `0` PRIME, `1` INVERSION (mirror around the subject's first note), `2` RETROGRADE, `3` RETROGRADE-INVERSION.
- `phase` — position offset within the subject; enables stretto. Wraps modulo subject length.
- `clock` — master time reference; any signed value.

`voice` (clamped `0-4`) enables optional inter-voice clash avoidance:

- `0` — stateless; behaves purely as above.
- `1-4` — record this voice's result in a per-bank table and, for voices `2-4`, nudge the result by a scale degree to avoid 2nds and 7ths against lower-numbered voices recorded at the same `clock`. Adjustment is bidirectional, and the result is octave-clamped to within two octaves of the lowest tracked voice. Call voices in ascending numerical order within a tick for reliable avoidance."""

["PN.FUGUE"]
prototype = "PN.FUGUE x voice division transpose mode phase clock"
short = "read pattern `x` as a fugal voice; return one scale degree for the given clock"
description = "As `P.FUGUE`, but reads pattern `x`, and the voice-avoidance state table is keyed per bank so independent fugues on different patterns do not interfere."

["P.ORN"]
prototype = "P.ORN type position"
short = "return an ornamented diatonic degree drawn from the working pattern's `START..END` window at `position`, transformed by ornament `type`"
description = """Stateless, read-only ornament reader. Reads the working pattern's value at `position` (a focal note) and returns it transformed by ornament `type`, using the focal note's immediate neighbours in the `START..END` window for context. Input and output are diatonic scale degrees (`1-7` = one octave), to pair with `P.MOTIF` / `P.CP` and quantise downstream with `N.S` / `QT.S`. Never writes the pattern, advances `P.I`, uses randomness or timing — the same pattern and args always yield the same value.

`position` wraps modulo the window length; neighbours wrap at the window edges. `type` selects the ornament (out of range collapses to `0` NONE):

- `0` NONE — focal note unchanged
- `1` ANTICIPATION — the next note (played early)
- `2` SUSPENSION — the previous note (held over)
- `3` NEIGHBOR_UP — focal `+ 1`
- `4` NEIGHBOR_DN — focal `- 1`
- `5` OCTAVE_UP — focal `+ 7`
- `6` OCTAVE_DN — focal `- 7`
- `7` FIFTH_UP — focal `+ 4`
- `8` FIFTH_DN — focal `- 4`
- `9` HALF_TURN_T — one degree past the next note, in the line's direction
- `10` HALF_TURN_A — one degree from the focal note, opposite the line

The result is clamped to the int16 range. An empty window (`START > END`) returns `0`. Pairs well with an ornament-type table held in another pattern bank, read via `PN.ORN`."""

["PN.ORN"]
prototype = "PN.ORN x type position"
short = "as `P.ORN`, but reads pattern `x`"
description = "As `P.ORN`, but reads pattern `x` rather than the working pattern."

